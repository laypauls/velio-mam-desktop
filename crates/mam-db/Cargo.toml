[package]
name = "mam-db"
version = "0.1.0"
description = "MAM Desktop - SQLite data model, migrations, path keys"
authors = []
edition = "2024"

[dependencies]
# refinery 0.10 accepts rusqlite >=0.23, <=0.40 — 0.41 would not unify, so pin 0.40.
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
refinery = { version = "0.10", features = ["rusqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
