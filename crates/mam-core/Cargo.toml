[package]
name = "mam-core"
version = "0.1.0"
description = "MAM Desktop - asset identity, file state model, content hashing, reconcile"
authors = []
edition = "2024"

[dependencies]
mam-db = { path = "../mam-db" }
rusqlite = { version = "0.40", features = ["bundled"] }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
tracing = "0.1"
mam-media = { path = "../mam-media" }
mam-vector = { path = "../mam-vector" }
thiserror = "2"
unicode-normalization = "0.1"
encoding_rs = "0.8"
argon2 = "0.5"
zeroize = "1"
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 원격 감사 로그 접속 (순수 Rust SSH — ring 백엔드, 계획 step 5)
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net", "io-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_WNet",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
# examples/search_e2e_bench.rs (P2-5 종단 지연 측정)
mam-search = { path = "../mam-search" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
