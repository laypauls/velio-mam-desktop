name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: pwsh

jobs:
  frontend:
    name: frontend (typecheck + vitest)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  rust:
    name: rust (fmt + clippy + test)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt, clippy
          cache-key: rust-check
      # tauri::generate_context! needs build.frontendDist (../dist) at compile time. dist is gitignored;
      # a placeholder is enough for fmt/clippy/test (the real frontend is built in the `build` job).
      - name: Placeholder frontend dist
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -Path dist/index.html -Value '<!doctype html><title>ci placeholder</title>'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # No --all-features: usearch/hnsw are feature-gated (USearch has MSVC issues).
      # Tests that need FFmpeg/models skip themselves when absent.
      - run: cargo test --workspace

  build:
    name: build (unsigned NSIS installer)
    needs: [frontend, rust]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: rust-build
      - run: pnpm install --frozen-lockfile
      # tauri.conf.json sets bundle.createUpdaterArtifacts=true, which fails without TAURI_SIGNING_PRIVATE_KEY.
      # CI builds are unsigned test installers, so updater artifacts are switched off via .github/tauri.ci.conf.json.
      # LGPL FFmpeg + whisper.cpp sidecars (gitignored, pinned URL + SHA-256). The overlay config adds them to the
      # bundle; cargo fmt/clippy/test never need them.
      - name: Fetch sidecars
        run: ./scripts/fetch-sidecars.ps1
      - name: Build installer (unsigned, no updater artifacts)
        run: pnpm tauri build --config .github/tauri.ci.conf.json --config src-tauri/tauri.sidecars.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: mam-desktop-nsis-unsigned
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
