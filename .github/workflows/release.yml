name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: signed updater build
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # Secrets reach steps only through env; values are never echoed.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Authenticode: NOT CONFIGURED YET (no certificate). The import step is skipped while this secret is empty.
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      # Public values (repo Variables): production updater public key and https endpoint.
      # The pubkey in tauri.conf.json is a test placeholder and must not ship.
      UPDATER_PUBKEY: ${{ vars.UPDATER_PUBKEY }}
      UPDATER_ENDPOINT: ${{ vars.UPDATER_ENDPOINT }}
      UPDATER_DOWNLOAD_BASE_URL: ${{ vars.UPDATER_DOWNLOAD_BASE_URL }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify signing inputs
        run: |
          $missing = @()
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { $missing += 'secret TAURI_SIGNING_PRIVATE_KEY' }
          if (-not $env:UPDATER_PUBKEY) { $missing += 'variable UPDATER_PUBKEY' }
          if (-not $env:UPDATER_ENDPOINT) { $missing += 'variable UPDATER_ENDPOINT' }
          if ($missing.Count -gt 0) {
            Write-Host "::error::Missing release inputs: $($missing -join ', '). Unsigned or placeholder-key artifacts are never distributed."
            exit 1
          }

      # The license notices carry a placeholder distributor contact (opensource@velio.example.invalid, `.invalid` = cannot be
      # delivered). Shipping it would make the written source offer (LGPL) unfulfillable, so externally released builds fail.
      # The license files are NOT regenerated here (manual task: node scripts/dump-licenses.mjs).
      - name: Fail on placeholder contact in license notices
        run: |
          $hits = Select-String -Path THIRD_PARTY_NOTICES.md, THIRD_PARTY_LICENSES.md -Pattern '\.invalid'
          if ($hits) {
            $hits | ForEach-Object { Write-Host "::error file=$($_.Path),line=$($_.LineNumber)::placeholder '.invalid' contact still present: $($_.Line.Trim())" }
            exit 1
          }

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Check tag matches tauri.conf.json version
        id: ver
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            Write-Host "::error::Tag $env:GITHUB_REF_NAME does not match tauri.conf.json version v$version"
            exit 1
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: rust-release
      - run: pnpm install --frozen-lockfile

      # Quality gate before shipping (same checks as CI).
      - run: pnpm typecheck
      - run: pnpm test
      # dist is gitignored; tauri::generate_context! needs it to exist while cargo test compiles src-tauri.
      - name: Placeholder dist for cargo test (tauri beforeBuildCommand builds the real one)
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -Path dist/index.html -Value '<!doctype html><title>ci placeholder</title>'
      - run: cargo test --workspace

      # OPTIONAL / NOT CONFIGURED: imports a code-signing certificate so tauri signs exe + installer
      # (bundle.windows.certificateThumbprint) BEFORE the updater .sig is computed.
      - name: Import Authenticode certificate (optional)
        id: cert
        if: ${{ env.WINDOWS_CERT_PFX_BASE64 != '' }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx -Force
          "thumbprint=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Write release tauri config
        env:
          OUT: ${{ runner.temp }}/release.conf.json
          CERT_THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
        run: node .github/scripts/release-config.mjs

      - name: Fetch sidecars (LGPL FFmpeg, whisper.cpp; pinned URL + SHA-256)
        run: ./scripts/fetch-sidecars.ps1

      - name: Build signed installer and updater artifacts
        run: pnpm tauri build --config "$env:RUNNER_TEMP/release.conf.json" --config src-tauri/tauri.sidecars.conf.json

      - name: Collect artifacts and generate latest.json stub
        env:
          BUNDLE_DIR: target/release/bundle/nsis
          OUT: dist-release/latest.json
          VERSION: ${{ steps.ver.outputs.version }}
          BASE_URL: ${{ vars.UPDATER_DOWNLOAD_BASE_URL != '' && vars.UPDATER_DOWNLOAD_BASE_URL || format('{0}/{1}/releases/download/{2}', github.server_url, github.repository, github.ref_name) }}
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe, target/release/bundle/nsis/*.exe.sig dist-release/
          node .github/scripts/make-latest-json.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: mam-desktop-release-${{ steps.ver.outputs.version }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: draft GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mam-desktop-release-${{ needs.build.outputs.version }}
          path: dist-release
      - name: Create draft release (never auto-published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem dist-release -File).FullName
          gh release create "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --draft --title "$env:GITHUB_REF_NAME" --generate-notes @files
